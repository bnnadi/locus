# Locus Railway topology — reference manifest.
#
# IMPORTANT: Railway does not read this file. Railway's config-as-code is
# per-service (services/<name>/railway.json, resolved from that service's
# Root Directory setting). This file is the human-readable map of the intended
# project: what runs, what it depends on, which variables it needs, and which
# settings only exist in the dashboard.
#
# Keep it in sync by hand. When it disagrees with the dashboard, the dashboard
# wins — so treat a mismatch found during an incident as a bug in this file.
#
# Dashboard-only settings, per service:
#   - Root Directory (services/<name>, except authentik →
#     services/authentik/server and authentik-worker →
#     services/authentik/worker; otherwise railway.json is ignored)
#   - Volume mounts (not expressible in railway.json)
#   - Public domain (default to none; see the notes below)
#   - Target port

project: locus

services:

  postgres:
    source: railway-template
    notes: >-
      Provisioned from Railway's Postgres template, not built from this repo.
      One instance; scripts/setup.sh creates a role and database per consuming
      service so no two services can read each other's tables.
    volume:
      mountPath: /var/lib/postgresql/data
    publicDomain: false
    consumers: [n8n, authentik]

  neo4j:
    source: railway-template
    notes: >-
      Shared with the Knowledge-Graph MCP. Resolve the CodePattern label
      question in docs/deployment/hermes-memory-layer.md before treating one
      instance as safe for both writers.
    volume:
      mountPath: /data
    internalPort: 7687
    publicDomain: false

  qdrant:
    source: services/qdrant
    internalPort: 6333
    volume:
      mountPath: /qdrant/storage
      sizeGB: 20
    env:
      - QDRANT__SERVICE__API_KEY
      - QDRANT__SERVICE__ENABLE_TLS   # false; Railway terminates TLS at the edge
    publicDomain: false

  ollama:
    source: services/ollama
    internalPort: 8080
    volume:
      # Ollama's blob directory. Without this, every redeploy re-downloads
      # multi-gigabyte weights.
      mountPath: /root/.ollama
      sizeGB: 50
    env:
      - OLLAMA_PULL_MODELS
    publicDomain: false
    notes: >-
      Railway has no GPU, so this is CPU-only inference. Ollama ships no
      authentication of any kind, so a public domain here is an open inference
      endpoint on your bill — keep it internal.

  n8n:
    source: services/n8n
    internalPort: 5678
    volume:
      mountPath: /home/node/.n8n
      sizeGB: 5
    env:
      - DB_TYPE                 # postgresdb
      - DB_POSTGRESDB_HOST
      - DB_POSTGRESDB_PORT
      - DB_POSTGRESDB_DATABASE
      - DB_POSTGRESDB_USER
      - DB_POSTGRESDB_PASSWORD
      - N8N_ENCRYPTION_KEY      # see note
      - N8N_PORT                # 5678; must equal PORT and the target port
      - PORT                    # 5678; Railway probes this. Pin it; do not leave the injected default if it is not 5678
      - GENERIC_TIMEZONE
      - HERMES_URL              # http://hermes.railway.internal:8642 — not RAILWAY_SERVICE_HERMES_URL (dashboard)
    dependsOn: [postgres]
    publicDomain: true
    notes: >-
      N8N_ENCRYPTION_KEY must be set before any credential is created. n8n
      generates a fresh key when its data directory is empty, which silently
      makes every previously stored credential undecryptable — and this happens
      even with Postgres as the backend, because the key lives on disk.
      Keep numReplicas at 1: in non-queue mode n8n runs its scheduler
      in-process, so a second replica fires every trigger twice.
      Railway probes PORT, not N8N_PORT. The image copies PORT onto
      N8N_PORT only when N8N_PORT is unset, and refuses to start if
      they differ. Set PORT=5678 so it matches N8N_PORT and the
      dashboard target port. healthcheckTimeout is 600s so first-boot
      /healthz/readiness 503s (migrations + fullyReady) do not exhaust
      the window. Do not switch the probe to /healthz.

  hermes-memory-router:
    source: services/hermes-memory-router
    internalPort: 8000
    env:
      - NEO4J_URI
      - NEO4J_USER
      - NEO4J_PASSWORD
      - QDRANT_URL
      - QDRANT_API_KEY
      - EXTRACTION_BACKEND
      - ANTHROPIC_API_KEY
      - OLLAMA_URL
      - HERMES_EXTRACT_ENDPOINT
      - HERMES_TOKEN
      - EMBEDDING_MODEL
    dependsOn: [neo4j, qdrant]
    publicDomain: false
    notes: >-
      POST /traces triggers a paid Anthropic call and the router has no
      authentication, so a public domain makes it a metered endpoint open to
      anyone. Hermes should reach it over the internal hostname.

  hermes:
    source: services/hermes
    internalPort: 9119
    volume:
      mountPath: /opt/data
    dependsOn: [hermes-memory-router]
    publicDomain: true
    env:
      - API_SERVER_ENABLED
      - API_SERVER_HOST
      - API_SERVER_PORT
      - API_SERVER_KEY
      - HERMES_DASHBOARD
      - HERMES_DASHBOARD_HOST
      - HERMES_DASHBOARD_PORT
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET
    notes: >-
      Dashboard on 9119 is the public surface. The official image fails
      closed on a non-loopback bind unless basic-auth, OAuth, or OIDC is
      set; HERMES_DASHBOARD_INSECURE is a no-op.       The OpenAI API on 8642
      stays internal. Attach a volume at /opt/data. Keep numReplicas at 1.

  authentik:
    source: services/authentik/server
    internalPort: 9000
    dependsOn: [postgres]
    publicDomain: true
    env:
      - AUTHENTIK_SECRET_KEY
      - AUTHENTIK_POSTGRESQL__HOST
      - AUTHENTIK_POSTGRESQL__PORT
      - AUTHENTIK_POSTGRESQL__NAME
      - AUTHENTIK_POSTGRESQL__USER
      - AUTHENTIK_POSTGRESQL__PASSWORD
      - AUTHENTIK_ERROR_REPORTING__ENABLED
      - AUTHENTIK_BOOTSTRAP_PASSWORD
      - AUTHENTIK_BOOTSTRAP_EMAIL
      - AUTHENTIK_BOOTSTRAP_TOKEN
    notes: >-
      OSS server. Dashboard Root Directory must be
      services/authentik/server. Public domain is required for login,
      OIDC, and JWKS. Do not attach it until bootstrap password, email,
      and token are set on this service AND authentik-worker —
      otherwise /if/flow/initial-setup/ is an internet race for the IdP
      Uzora will trust. Paste generated hex for secrets, not the
      env.example openssl generator. Pin PORT=9000. Do not attach a
      /data volume. OIDC state is in Postgres. healthcheckPath is
      /-/health/ready/. Keep numReplicas at 1. Create the OIDC app
      after first boot, then set AUTHENTIK_ISSUER on Uzora. Same
      AUTHENTIK_SECRET_KEY and AUTHENTIK_POSTGRESQL__* as the worker
      (one database, two processes).

  authentik-worker:
    source: services/authentik/worker
    dependsOn: [postgres, authentik]
    publicDomain: false
    env:
      - AUTHENTIK_SECRET_KEY
      - AUTHENTIK_POSTGRESQL__HOST
      - AUTHENTIK_POSTGRESQL__PORT
      - AUTHENTIK_POSTGRESQL__NAME
      - AUTHENTIK_POSTGRESQL__USER
      - AUTHENTIK_POSTGRESQL__PASSWORD
      - AUTHENTIK_ERROR_REPORTING__ENABLED
      - AUTHENTIK_BOOTSTRAP_PASSWORD
      - AUTHENTIK_BOOTSTRAP_EMAIL
      - AUTHENTIK_BOOTSTRAP_TOKEN
    notes: >-
      Same image pin as authentik, CMD worker. Dashboard Root Directory
      must be services/authentik/worker. Do not clone the server
      service — that copies the HTTP health probe. Create an empty
      service. No public domain. No healthcheckPath. No /data volume.
      Bootstrap vars belong here (official automated install). Keep
      numReplicas at 1. Shares the authentik Postgres role; do not add
      authentik-worker to setup.sh DB_CONSUMERS.

  uzora:
    source: services/uzora
    internalPort: 8100
    dependsOn: [authentik]
    publicDomain: false
    env:
      - AUTHENTIK_URL
      - AUTHENTIK_ISSUER
      - AUTHENTIK_AUDIENCE
    notes: >-
      Token gate, not an MCP proxy. /mcp is 501. Keep off a public
      domain. AUTHENTIK_URL must be the in-network origin
      (http://authentik.railway.internal:9000), not the public
      hostname. ISSUER/AUDIENCE stay empty until the OIDC app exists;
      /health still works. Pin PORT=8100. Keep numReplicas at 1.