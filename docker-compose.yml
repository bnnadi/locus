# Base Compose definition for the Locus stack.
#
# The development override lives in config/ rather than beside this file, so
# Compose will not auto-discover it. Pass it explicitly:
#
#   docker compose -f docker-compose.yml -f config/docker-compose.override.yml up -d
#
# or use scripts/deploy.sh --target compose, which does that for you.
#
# Every published port is bound to 127.0.0.1. Docker's port publishing writes
# its own iptables rules and bypasses UFW, so a bare "5678:5678" would expose
# the service to the internet on a cloud host even with a firewall configured.
#
# Image versions come from the environment (see config/env.example) so they
# are pinned in one place. Bump them there, not here.

name: locus

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Only the maintenance database is created here. Per-service roles and
      # databases are created by scripts/setup.sh.
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  neo4j:
    image: neo4j:${NEO4J_VERSION:-5-community}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
    volumes:
      - neo4j_data:/data
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      # cypher-shell ships inside the image, so this proves Bolt is actually
      # answering rather than just that the process started.
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  qdrant:
    build:
      context: ./services/qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama:
    build:
      context: ./services/ollama
    restart: unless-stopped
    environment:
      # Named to avoid colliding with Ollama's own OLLAMA_MODELS, which sets
      # the models *directory*. See services/ollama/entrypoint.sh.
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:-}
    volumes:
      # Must match wherever Ollama stores blobs, or every restart re-downloads
      # multi-gigabyte weights.
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-8080}:8080"

  n8n:
    build:
      context: ./services/n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
      # Without this, n8n generates a new key whenever /home/node/.n8n is
      # empty and every previously saved credential becomes undecryptable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_PORT: 5678
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  hermes-memory-router:
    build:
      context: ./services/hermes-memory-router
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      EXTRACTION_BACKEND: ${EXTRACTION_BACKEND:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: http://ollama:8080
      HERMES_EXTRACT_ENDPOINT: ${HERMES_EXTRACT_ENDPOINT:-}
      HERMES_TOKEN: ${HERMES_TOKEN:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    ports:
      - "127.0.0.1:${HERMES_ROUTER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
  neo4j_data:
  qdrant_storage:
  ollama_models:
  n8n_data:
